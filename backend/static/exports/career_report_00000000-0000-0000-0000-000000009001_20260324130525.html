<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职业规划报告</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #1a73e8;
            text-align: center;
            border-bottom: 2px solid #1a73e8;
            padding-bottom: 10px;
        }
        h2 {
            color: #333;
            margin-top: 30px;
            border-left: 4px solid #1a73e8;
            padding-left: 10px;
        }
        h3 {
            color: #555;
            margin-top: 20px;
        }
        h4 {
            color: #666;
            margin-top: 15px;
        }
        .summary {
            background: #f5f5f5;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .chapter {
            margin-bottom: 40px;
        }
        .section {
            margin-bottom: 15px;
        }
        .section p {
            text-indent: 2em;
            margin: 10px 0;
        }
        ul {
            margin-left: 20px;
        }
        li {
            margin: 5px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #f5f5f5;
        }
        .chart-container {
            margin: 20px 0;
            padding: 16px;
            background: #fafafa;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .chart-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0;
        }
        .chart-label {
            width: 120px;
            flex-shrink: 0;
            font-weight: 600;
        }
        .chart-bar {
            flex: 1;
            height: 10px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
        }
        .chart-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #2563eb);
        }
        .chart-value {
            width: 48px;
            text-align: right;
            color: #4b5563;
            font-size: 12px;
        }
        .recommendations {
            background: #e8f0fe;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .recommendation-item {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 3px;
        }
        .footer {
            text-align: center;
            color: #999;
            margin-top: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>大学生职业规划报告</h1>

    <div class="summary">
        <h3>报告摘要</h3>
        <p>This is modified summary</p>
    </div>

    

    <div class="recommendations">
        <h3>推荐建议</h3>
        <div class="recommendation-item"><strong>需要提升</strong>: 建议针对差距项进行针对性提升，补齐能力短板。</div>
    </div>

    

    <div class="footer">
        <p>报告生成时间：Unknown</p>
        <p>版本：1.1</p>
    </div>
</body>
</html>
